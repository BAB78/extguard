name: Release extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to both registries after validation
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_path: ${{ steps.package.outputs.artifact_path }}
      sha256: ${{ steps.package.outputs.sha256 }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run release preflight
        run: npm run preflight

      - name: Verify the release version
        id: release
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          should_publish=false

          if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "Publishing is allowed only from a version tag." >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
              exit 1
            fi
            should_publish=true
          fi

          echo "should_publish=${should_publish}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package the reproducible VSIX
        id: package
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          artifact="extguard-security-${{ steps.release.outputs.version }}.vsix"
          artifact_name="extguard-vsix-${{ steps.release.outputs.version }}"
          ./node_modules/.bin/vsce package --out "${artifact}"
          test -s "${artifact}"
          sha256="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
          echo "${sha256}  ${artifact}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Publish both registries
    needs: build
    if: ${{ needs.build.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out the release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked publishing tools
        run: npm ci --ignore-scripts

      - name: Download the release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      - name: Verify the release artifact
        id: artifact
        shell: bash
        env:
          ARTIFACT_FILE: ${{ needs.build.outputs.artifact_path }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          path="release-artifact/${ARTIFACT_FILE}"
          test -s "${path}"
          actual_sha256="$(sha256sum "${path}" | cut -d ' ' -f 1)"
          if [[ "${actual_sha256}" != "${EXPECTED_SHA256}" ]]; then
            echo "Release artifact checksum mismatch." >&2
            exit 1
          fi
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Verify Visual Studio Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "${VSCE_PAT:-}" || { echo "VSCE_PAT is not configured." >&2; exit 1; }
          ./node_modules/.bin/vsce verify-pat babstudios

      - name: Verify Open VSX credentials
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "${OVSX_PAT:-}" || { echo "OVSX_PAT is not configured." >&2; exit 1; }
          ./node_modules/.bin/ovsx verify-pat babstudios

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          ./node_modules/.bin/vsce publish
          --packagePath "${{ steps.artifact.outputs.path }}"
          --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: >-
          ./node_modules/.bin/ovsx publish
          "${{ steps.artifact.outputs.path }}"
          --skip-duplicate
